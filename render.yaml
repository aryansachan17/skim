services:
  - type: keyvalue
    name: skim-kv
    plan: free
    region: singapore
    ipAllowList: []

  - type: web
    name: skim-reader-api-staging
    runtime: image
    image:
      url: ghcr.io/aryansachan17/skim-backend:latest
    plan: free
    region: singapore
    healthCheckPath: /healthCheck
    autoDeployTrigger: off
    envVars:
      - key: SKIM_ENV
        value: staging
      - key: SKIM_MONGO_URI
        sync: false
      - key: SKIM_REDIS_URL
        fromService:
          type: keyvalue
          name: skim-kv
          property: connectionString
      - key: SKIM_CORS_ORIGINS
        value: '["https://skim-reader-web-staging.onrender.com"]'

  - type: web
    name: skim-reader-web-staging
    runtime: static
    rootDir: frontend
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build
    staticPublishPath: ./dist
    autoDeployTrigger: off
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: VITE_GRAPHQL_URL
        value: https://skim-reader-api-staging.onrender.com/graphql
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
