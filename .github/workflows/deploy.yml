name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/aryansachan17/skim-backend

jobs:
  publish:
    name: Publish backend image
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Work out the image tag
        id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_REPOSITORY:main-$SHA" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build and push the image
        env:
          SHA: ${{ steps.tag.outputs.sha }}
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          docker build --build-arg GIT_SHA="$SHA" --tag "$IMAGE" --tag "$IMAGE_REPOSITORY:latest" backend
          docker push "$IMAGE"
          docker push "$IMAGE_REPOSITORY:latest"

  deploy-staging:
    name: Deploy to staging
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_WEB_URL }}
    steps:
      - name: Check the staging environment is configured
        env:
          API_HOOK: ${{ secrets.STAGING_API_DEPLOY_HOOK }}
          WEB_HOOK: ${{ secrets.STAGING_WEB_DEPLOY_HOOK }}
          API_URL: ${{ vars.STAGING_API_URL }}
          WEB_URL: ${{ vars.STAGING_WEB_URL }}
        run: |
          missing=""
          [ -n "$API_HOOK" ] || missing="$missing secret:STAGING_API_DEPLOY_HOOK"
          [ -n "$WEB_HOOK" ] || missing="$missing secret:STAGING_WEB_DEPLOY_HOOK"
          [ -n "$API_URL" ] || missing="$missing variable:STAGING_API_URL"
          [ -n "$WEB_URL" ] || missing="$missing variable:STAGING_WEB_URL"
          if [ -n "$missing" ]; then
            echo "The staging environment is missing:$missing"
            exit 1
          fi
      - name: Deploy this exact image to the staging API
        env:
          HOOK: ${{ secrets.STAGING_API_DEPLOY_HOOK }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: curl --fail --silent --show-error --get "$HOOK" --data-urlencode "imgURL=$IMAGE" --output /dev/null
      - name: Wait until staging is healthy on this version
        env:
          API_URL: ${{ vars.STAGING_API_URL }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          body=""
          for attempt in $(seq 1 60); do
            body=$(curl --silent --max-time 15 "$API_URL/healthCheck" || true)
            if echo "$body" | grep --quiet "\"version\":\"$SHA\"" && echo "$body" | grep --quiet '"status":"ok"'; then
              echo "Staging is healthy on $SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Staging was not healthy on $SHA after 10 minutes. Last response: $body"
          exit 1
      - name: Deploy the frontend at the same commit
        env:
          HOOK: ${{ secrets.STAGING_WEB_DEPLOY_HOOK }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: curl --fail --silent --show-error --get "$HOOK" --data-urlencode "ref=$SHA" --output /dev/null
