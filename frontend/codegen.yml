schema: ./schema.graphql
documents: ./src/**/*.graphql.ts
generates:
  ./src/:
    preset: near-operation-file
    presetConfig:
      extension: .generated.tsx
    plugins:
      - add:
          content: '/* Generated by graphql-codegen from the neighbouring .graphql.ts file. Do not edit. */'
      - typescript-operations
      - typescript-react-apollo
    config:
      withHooks: true
      withHOC: false
      withComponent: false
